<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
  <title id="title">Human and agent authority boundary</title>
  <desc id="desc">Who does what. HUMAN: Defines the mission. Accepts or rejects evidence. Reviews the brief. Approves the final artifact. AGENT: Reads the workspace. Searches OpenAlex. Inspects source details. Proposes evidence. Drafts the Evidence Brief. The agent can propose evidence. Only the human decides what counts.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#17221E" flood-opacity="0.07"/>
    </filter>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .ink { fill: #17221E; }
      .muted { fill: #5A6862; }
      .green { fill: #145D49; }
      .gold { fill: #7A4A0A; }
      .agent { fill: #3153A4; }
    </style>
  </defs>

  <rect width="1500" height="1000" fill="#F3F2ED"/>
  <rect x="0" y="0" width="1500" height="12" fill="#145D49"/>

  <text x="84" y="92" class="sans green" font-size="18" font-weight="800" letter-spacing="3">THREE IN THE LOOP · AUTHORITY MODEL</text>
  <text x="84" y="170" class="sans ink" font-size="70" font-weight="800" letter-spacing="-2">Who does what</text>
  <text x="84" y="217" class="sans muted" font-size="27">Speed from the agent. Evidence authority from the human.</text>

  <g transform="translate(84 275)">
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="625" height="505" rx="28" fill="#FFFFFF" stroke="#D4DCD7" stroke-width="2"/>
      <rect x="707" y="0" width="625" height="505" rx="28" fill="#FFFFFF" stroke="#D4DCD7" stroke-width="2"/>
    </g>

    <rect x="0" y="0" width="625" height="10" rx="5" fill="#7A4A0A"/>
    <circle cx="68" cy="74" r="38" fill="#F9F0DF" stroke="#7A4A0A" stroke-width="2.5"/>
    <path d="M53 72 L64 83 L84 59" fill="none" stroke="#7A4A0A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="124" y="68" class="sans gold" font-size="20" font-weight="800" letter-spacing="2.6">HUMAN</text>
    <text x="124" y="104" class="sans ink" font-size="30" font-weight="800">Owns the decision</text>

    <g class="sans ink" font-size="27" font-weight="700">
      <circle cx="65" cy="172" r="7" fill="#7A4A0A"/>
      <text x="94" y="181">Defines the mission</text>
      <circle cx="65" cy="242" r="7" fill="#7A4A0A"/>
      <text x="94" y="251">Accepts or rejects evidence</text>
      <circle cx="65" cy="312" r="7" fill="#7A4A0A"/>
      <text x="94" y="321">Reviews the brief</text>
      <circle cx="65" cy="382" r="7" fill="#7A4A0A"/>
      <text x="94" y="391">Approves the final artifact</text>
    </g>
    <rect x="50" y="438" width="525" height="40" rx="20" fill="#F9F0DF"/>
    <text x="312.5" y="465" class="sans gold" font-size="16" font-weight="800" letter-spacing="1.2" text-anchor="middle">MISSION · EVIDENCE · REVIEW · APPROVAL</text>

    <rect x="707" y="0" width="625" height="10" rx="5" fill="#3153A4"/>
    <circle cx="775" cy="74" r="38" fill="#EDF1FB" stroke="#3153A4" stroke-width="2.5"/>
    <path d="M758 75 C764 60, 786 60, 792 75 M764 82 H786" fill="none" stroke="#3153A4" stroke-width="4" stroke-linecap="round"/>
    <text x="831" y="68" class="sans agent" font-size="20" font-weight="800" letter-spacing="2.6">AGENT</text>
    <text x="831" y="104" class="sans ink" font-size="30" font-weight="800">Owns the legwork</text>

    <g class="sans ink" font-size="27" font-weight="700">
      <circle cx="772" cy="162" r="7" fill="#3153A4"/>
      <text x="801" y="171">Reads the workspace</text>
      <circle cx="772" cy="222" r="7" fill="#3153A4"/>
      <text x="801" y="231">Searches OpenAlex</text>
      <circle cx="772" cy="282" r="7" fill="#3153A4"/>
      <text x="801" y="291">Inspects source details</text>
      <circle cx="772" cy="342" r="7" fill="#3153A4"/>
      <text x="801" y="351">Proposes evidence</text>
      <circle cx="772" cy="402" r="7" fill="#3153A4"/>
      <text x="801" y="411">Drafts the Evidence Brief</text>
    </g>
    <rect x="757" y="438" width="525" height="40" rx="20" fill="#EDF1FB"/>
    <text x="1019.5" y="465" class="sans agent" font-size="16" font-weight="800" letter-spacing="1.2" text-anchor="middle">READ · SEARCH · INSPECT · PROPOSE · DRAFT</text>

    <g transform="translate(641 153)">
      <rect x="0" y="0" width="50" height="198" rx="25" fill="#E9F3EF" stroke="#8FBCAA" stroke-width="2"/>
      <circle cx="25" cy="36" r="10" fill="#7A4A0A"/>
      <path d="M25 52 V91" stroke="#AAB8B0" stroke-width="3" stroke-dasharray="5 7"/>
      <circle cx="25" cy="104" r="10" fill="#145D49"/>
      <path d="M25 117 V156" stroke="#AAB8B0" stroke-width="3" stroke-dasharray="5 7"/>
      <circle cx="25" cy="169" r="10" fill="#3153A4"/>
    </g>
  </g>

  <g transform="translate(84 824)">
    <rect x="0" y="0" width="1332" height="118" rx="26" fill="#17221E"/>
    <text x="44" y="48" class="sans" font-size="28" font-weight="700" fill="#D7E0DB">The agent can propose evidence.</text>
    <text x="44" y="89" class="sans" font-size="34" font-weight="800" fill="#FFFFFF">Only the human decides what counts.</text>
    <rect x="1038" y="31" width="244" height="56" rx="28" fill="#F9F0DF"/>
    <text x="1160" y="67" class="sans gold" font-size="16" font-weight="800" letter-spacing="1" text-anchor="middle">INTENTIONAL BOUNDARY</text>
  </g>
</svg>
