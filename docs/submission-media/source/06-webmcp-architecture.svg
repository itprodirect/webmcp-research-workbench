<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
  <title id="title">WebMCP architecture and five declared tools</title>
  <desc id="desc">WebMCP architecture. Human UI. Three in the Loop. WebMCP-enabled agent. OpenAlex. Shared browser workspace. get_research_workspace. search_sources. get_source_details. propose_evidence. draft_evidence_brief. Structured tools, shared state, human-controlled evidence. 93/93 tests PASS, lint PASS, build PASS, production PASS, final human dogfood PASS.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#17221E" flood-opacity="0.07"/>
    </filter>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto">
      <path d="M0,0 L9,5.5 L0,11 Z" fill="#145D49"/>
    </marker>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto">
      <path d="M0,0 L9,5.5 L0,11 Z" fill="#3153A4"/>
    </marker>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: Consolas, "Courier New", monospace; }
      .ink { fill: #17221E; }
      .muted { fill: #5A6862; }
      .green { fill: #145D49; }
      .gold { fill: #7A4A0A; }
      .agent { fill: #3153A4; }
    </style>
  </defs>

  <rect width="1500" height="1000" fill="#F3F2ED"/>
  <rect x="0" y="0" width="1500" height="12" fill="#145D49"/>

  <text x="84" y="92" class="sans green" font-size="18" font-weight="800" letter-spacing="3">THREE IN THE LOOP · TECHNICAL PROOF</text>
  <text x="84" y="170" class="sans ink" font-size="70" font-weight="800" letter-spacing="-2">WebMCP architecture</text>
  <text x="84" y="217" class="sans muted" font-size="26">The agent uses declared capabilities against the same browser workspace the human sees.</text>

  <g transform="translate(84 246)" opacity="0.68">
    <rect x="0" y="6" width="1332" height="42" rx="21" fill="#F3F2ED" stroke="#D4DCD7" stroke-width="1"/>
    <circle cx="30" cy="27" r="7" fill="#17643E"/>
    <text x="55" y="35" class="sans ink" font-size="16" font-weight="700">93/93 tests PASS</text>
    <circle cx="286" cy="27" r="4" fill="#AAB8B0"/>
    <text x="309" y="35" class="sans ink" font-size="16" font-weight="700">lint PASS</text>
    <circle cx="473" cy="27" r="4" fill="#AAB8B0"/>
    <text x="496" y="35" class="sans ink" font-size="16" font-weight="700">build PASS</text>
    <circle cx="686" cy="27" r="4" fill="#AAB8B0"/>
    <text x="709" y="35" class="sans ink" font-size="16" font-weight="700">production PASS</text>
    <circle cx="930" cy="27" r="4" fill="#AAB8B0"/>
    <text x="953" y="35" class="sans ink" font-size="16" font-weight="700">final human dogfood PASS</text>
  </g>

  <g transform="translate(62 316)">
    <g filter="url(#shadow)">
      <rect x="0" y="118" width="282" height="268" rx="28" fill="#FFFFFF" stroke="#3153A4" stroke-width="3"/>
    </g>
    <circle cx="141" cy="183" r="42" fill="#EDF1FB" stroke="#3153A4" stroke-width="2.5"/>
    <path d="M121 184 C129 164, 153 164, 161 184 M128 193 H154" fill="none" stroke="#3153A4" stroke-width="5" stroke-linecap="round"/>
    <text x="141" y="255" class="sans agent" font-size="18" font-weight="800" letter-spacing="1.4" text-anchor="middle">WEBMCP-ENABLED</text>
    <text x="141" y="293" class="sans ink" font-size="35" font-weight="800" text-anchor="middle">agent</text>
    <text x="141" y="336" class="sans muted" font-size="19" text-anchor="middle">Discovers and invokes</text>
    <text x="141" y="365" class="sans muted" font-size="19" text-anchor="middle">the declared tools</text>

    <rect x="355" y="0" width="705" height="520" rx="30" fill="#FFFFFF" stroke="#145D49" stroke-width="3" stroke-dasharray="10 9" filter="url(#shadow)"/>
    <rect x="385" y="-18" width="314" height="38" rx="19" fill="#E9F3EF"/>
    <text x="542" y="8" class="sans green" font-size="16" font-weight="800" letter-spacing="1.5" text-anchor="middle">SHARED BROWSER WORKSPACE</text>

    <rect x="397" y="48" width="621" height="126" rx="22" fill="#FAFAF7" stroke="#D4DCD7" stroke-width="2"/>
    <circle cx="445" cy="111" r="28" fill="#E9F3EF" stroke="#145D49" stroke-width="2"/>
    <circle cx="433" cy="101" r="5.5" fill="#7A4A0A"/>
    <circle cx="457" cy="101" r="5.5" fill="#3153A4"/>
    <circle cx="445" cy="124" r="5.5" fill="#145D49"/>
    <path d="M433 101 C438 90, 452 90, 457 101 M457 101 C466 114, 458 124, 445 124 M445 124 C431 124, 425 113, 433 101" fill="none" stroke="#AAB8B0" stroke-width="2"/>
    <text x="493" y="98" class="sans ink" font-size="33" font-weight="800">Three in the Loop</text>
    <text x="493" y="133" class="sans green" font-size="18" font-weight="800">A WebMCP Research Workbench</text>
    <text x="493" y="158" class="sans muted" font-size="17">Website capabilities + bounded browser-local workspace</text>

    <path d="M708 174 V213" stroke="#145D49" stroke-width="4"/>
    <rect x="420" y="208" width="576" height="46" rx="23" fill="#E9F3EF" stroke="#8FBCAA" stroke-width="2"/>
    <text x="708" y="238" class="sans green" font-size="17" font-weight="800" letter-spacing="1.2" text-anchor="middle">ONE SHARED, LIVE WORKSPACE STATE</text>

    <rect x="397" y="282" width="270" height="190" rx="22" fill="#F9F0DF" stroke="#7A4A0A" stroke-width="2.5"/>
    <text x="427" y="326" class="sans gold" font-size="18" font-weight="800" letter-spacing="1.7">HUMAN UI</text>
    <text x="427" y="366" class="sans ink" font-size="25" font-weight="800">Human authority</text>
    <text x="427" y="404" class="sans muted" font-size="18">Mission · evidence decisions</text>
    <text x="427" y="432" class="sans muted" font-size="18">Editing · review · approval</text>

    <rect x="698" y="282" width="320" height="232" rx="22" fill="#EDF1FB" stroke="#3153A4" stroke-width="2.5"/>
    <text x="724" y="316" class="sans agent" font-size="16" font-weight="800" letter-spacing="1.3">WEBMCP TOOL SURFACE</text>

    <rect x="720" y="332" width="276" height="28" rx="14" fill="#FFFFFF"/>
    <text x="735" y="352" class="mono ink" font-size="17" font-weight="700">get_research_workspace</text>
    <rect x="720" y="368" width="276" height="28" rx="14" fill="#FFFFFF"/>
    <text x="735" y="388" class="mono ink" font-size="17" font-weight="700">search_sources</text>
    <rect x="720" y="404" width="276" height="28" rx="14" fill="#FFFFFF"/>
    <text x="735" y="424" class="mono ink" font-size="17" font-weight="700">get_source_details</text>
    <rect x="720" y="440" width="276" height="28" rx="14" fill="#FFFFFF"/>
    <text x="735" y="460" class="mono ink" font-size="17" font-weight="700">propose_evidence</text>
    <rect x="720" y="476" width="276" height="28" rx="14" fill="#FFFFFF"/>
    <text x="735" y="496" class="mono ink" font-size="17" font-weight="700">draft_evidence_brief</text>

    <path d="M1060 111 H1116" stroke="#145D49" stroke-width="4" marker-end="url(#arrowGreen)"/>

    <g filter="url(#shadow)">
      <rect x="1128" y="35" width="248" height="152" rx="26" fill="#FFFFFF" stroke="#145D49" stroke-width="3"/>
    </g>
    <circle cx="1252" cy="82" r="23" fill="#E9F3EF" stroke="#145D49" stroke-width="2"/>
    <path d="M1238 82 H1266 M1252 68 V96" stroke="#145D49" stroke-width="3" stroke-linecap="round"/>
    <text x="1252" y="130" class="sans ink" font-size="31" font-weight="800" text-anchor="middle">OpenAlex</text>
    <text x="1252" y="161" class="sans muted" font-size="17" font-weight="700" text-anchor="middle">research provider</text>

    <path d="M305 252 H346" fill="none" stroke="#3153A4" stroke-width="4" marker-end="url(#arrowBlue)"/>
  </g>

  <g transform="translate(84 894)">
    <rect x="0" y="0" width="1332" height="72" rx="36" fill="#17221E"/>
    <text x="666" y="46" class="sans" fill="#FFFFFF" font-size="29" font-weight="800" text-anchor="middle">Structured tools, shared state, human-controlled evidence</text>
  </g>
</svg>
