<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
  <title id="title">How Three in the Loop works</title>
  <desc id="desc">How it works. 1. Human defines. 2. Agent researches. 3. Human curates. 4. Agent synthesizes. 5. Human approves. The agent does the research legwork. The human controls what becomes evidence and what gets approved. Shared live workspace powered by WebMCP.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#17221E" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto">
      <path d="M0,0 L9,5.5 L0,11 Z" fill="#AAB8B0"/>
    </marker>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .ink { fill: #17221E; }
      .muted { fill: #5A6862; }
      .green { fill: #145D49; }
      .gold { fill: #7A4A0A; }
      .agent { fill: #3153A4; }
    </style>
  </defs>

  <rect width="1500" height="1000" fill="#F3F2ED"/>
  <rect x="0" y="0" width="1500" height="12" fill="#145D49"/>

  <text x="84" y="92" class="sans green" font-size="18" font-weight="800" letter-spacing="3">THREE IN THE LOOP · WORKFLOW</text>
  <text x="84" y="170" class="sans ink" font-size="70" font-weight="800" letter-spacing="-2">How it works</text>
  <text x="84" y="217" class="sans muted" font-size="27">One shared workspace. Five deliberate handoffs.</text>

  <g transform="translate(84 290)">
    <path d="M240 171 H286" stroke="#AAB8B0" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M503 171 H549" stroke="#AAB8B0" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M766 171 H812" stroke="#AAB8B0" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M1029 171 H1075" stroke="#AAB8B0" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="0" y="0" width="225" height="342" rx="24" fill="#FFFFFF" stroke="#D4DCD7" stroke-width="2"/>
      <rect x="263" y="0" width="225" height="342" rx="24" fill="#FFFFFF" stroke="#D4DCD7" stroke-width="2"/>
      <rect x="526" y="0" width="225" height="342" rx="24" fill="#FFFFFF" stroke="#D4DCD7" stroke-width="2"/>
      <rect x="789" y="0" width="225" height="342" rx="24" fill="#FFFFFF" stroke="#D4DCD7" stroke-width="2"/>
      <rect x="1052" y="0" width="225" height="342" rx="24" fill="#FFFFFF" stroke="#D4DCD7" stroke-width="2"/>
    </g>

    <rect x="0" y="0" width="225" height="8" rx="4" fill="#7A4A0A"/>
    <circle cx="40" cy="55" r="24" fill="#F9F0DF" stroke="#7A4A0A" stroke-width="2"/>
    <text x="40" y="64" class="sans gold" font-size="25" font-weight="800" text-anchor="middle">1.</text>
    <text x="24" y="118" class="sans ink" font-size="30" font-weight="800">
      <tspan x="24">Human</tspan><tspan x="24" dy="38">defines</tspan>
    </text>
    <text x="24" y="216" class="sans muted" font-size="20">
      <tspan x="24">Question, audience,</tspan><tspan x="24" dy="29">evidence limit</tspan>
    </text>
    <rect x="24" y="286" width="96" height="32" rx="16" fill="#F9F0DF"/>
    <text x="72" y="308" class="sans gold" font-size="15" font-weight="800" text-anchor="middle">HUMAN</text>

    <rect x="263" y="0" width="225" height="8" rx="4" fill="#3153A4"/>
    <circle cx="303" cy="55" r="24" fill="#EDF1FB" stroke="#3153A4" stroke-width="2"/>
    <text x="303" y="64" class="sans agent" font-size="25" font-weight="800" text-anchor="middle">2.</text>
    <text x="287" y="118" class="sans ink" font-size="30" font-weight="800">
      <tspan x="287">Agent</tspan><tspan x="287" dy="38">researches</tspan>
    </text>
    <text x="287" y="216" class="sans muted" font-size="20">
      <tspan x="287">Search, inspect,</tspan><tspan x="287" dy="29">propose</tspan>
    </text>
    <rect x="287" y="286" width="92" height="32" rx="16" fill="#EDF1FB"/>
    <text x="333" y="308" class="sans agent" font-size="15" font-weight="800" text-anchor="middle">AGENT</text>

    <rect x="526" y="0" width="225" height="8" rx="4" fill="#7A4A0A"/>
    <circle cx="566" cy="55" r="24" fill="#F9F0DF" stroke="#7A4A0A" stroke-width="2"/>
    <text x="566" y="64" class="sans gold" font-size="25" font-weight="800" text-anchor="middle">3.</text>
    <text x="550" y="118" class="sans ink" font-size="30" font-weight="800">
      <tspan x="550">Human</tspan><tspan x="550" dy="38">curates</tspan>
    </text>
    <text x="550" y="216" class="sans muted" font-size="20">
      <tspan x="550">Accept or reject</tspan><tspan x="550" dy="29">each proposal</tspan>
    </text>
    <rect x="550" y="286" width="96" height="32" rx="16" fill="#F9F0DF"/>
    <text x="598" y="308" class="sans gold" font-size="15" font-weight="800" text-anchor="middle">HUMAN</text>

    <rect x="789" y="0" width="225" height="8" rx="4" fill="#3153A4"/>
    <circle cx="829" cy="55" r="24" fill="#EDF1FB" stroke="#3153A4" stroke-width="2"/>
    <text x="829" y="64" class="sans agent" font-size="25" font-weight="800" text-anchor="middle">4.</text>
    <text x="813" y="118" class="sans ink" font-size="30" font-weight="800">
      <tspan x="813">Agent</tspan><tspan x="813" dy="38">synthesizes</tspan>
    </text>
    <text x="813" y="216" class="sans muted" font-size="20">
      <tspan x="813">Draft from accepted</tspan><tspan x="813" dy="29">evidence only</tspan>
    </text>
    <rect x="813" y="286" width="92" height="32" rx="16" fill="#EDF1FB"/>
    <text x="859" y="308" class="sans agent" font-size="15" font-weight="800" text-anchor="middle">AGENT</text>

    <rect x="1052" y="0" width="225" height="8" rx="4" fill="#17643E"/>
    <circle cx="1092" cy="55" r="24" fill="#E9F3EF" stroke="#17643E" stroke-width="2"/>
    <text x="1092" y="64" class="sans green" font-size="25" font-weight="800" text-anchor="middle">5.</text>
    <text x="1076" y="118" class="sans ink" font-size="30" font-weight="800">
      <tspan x="1076">Human</tspan><tspan x="1076" dy="38">approves</tspan>
    </text>
    <text x="1076" y="216" class="sans muted" font-size="20">
      <tspan x="1076">Review, approve,</tspan><tspan x="1076" dy="29">download</tspan>
    </text>
    <rect x="1076" y="286" width="96" height="32" rx="16" fill="#E9F3EF"/>
    <text x="1124" y="308" class="sans green" font-size="15" font-weight="800" text-anchor="middle">HUMAN</text>
  </g>

  <g transform="translate(84 685)">
    <rect x="0" y="0" width="1332" height="142" rx="24" fill="#FFFFFF" stroke="#D4DCD7" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="10" height="142" rx="5" fill="#145D49"/>
    <text x="42" y="54" class="sans ink" font-size="31" font-weight="800">The agent does the research legwork.</text>
    <text x="42" y="99" class="sans muted" font-size="28">The human controls what becomes evidence and what gets approved.</text>
  </g>

  <g transform="translate(84 865)">
    <rect x="0" y="0" width="1332" height="72" rx="36" fill="#E9F3EF" stroke="#8FBCAA" stroke-width="2"/>
    <circle cx="47" cy="36" r="11" fill="#7A4A0A"/>
    <circle cx="79" cy="36" r="11" fill="#3153A4"/>
    <circle cx="111" cy="36" r="11" fill="#145D49"/>
    <path d="M58 36 H68 M90 36 H100" stroke="#AAB8B0" stroke-width="3"/>
    <text x="151" y="46" class="sans green" font-size="27" font-weight="800">Shared live workspace powered by WebMCP</text>
    <text x="1286" y="44" class="sans muted" font-size="17" font-weight="800" letter-spacing="1.3" text-anchor="end">STRUCTURED HANDOFFS</text>
  </g>
</svg>
