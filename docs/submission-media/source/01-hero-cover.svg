<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
  <title id="title">Three in the Loop hero cover</title>
  <desc id="desc">Three in the Loop. The agent gathers. You decide what counts. A WebMCP research workbench for human-controlled evidence and source-linked synthesis. Human + Agent + Website working together.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#17221E" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .ink { fill: #17221E; }
      .muted { fill: #5A6862; }
      .green { fill: #145D49; }
      .gold { fill: #7A4A0A; }
      .agent { fill: #3153A4; }
      .caps { font-size: 18px; font-weight: 800; letter-spacing: 3.2px; }
    </style>
  </defs>

  <rect width="1500" height="1000" fill="#F3F2ED"/>
  <rect x="0" y="0" width="1500" height="12" fill="#145D49"/>

  <g transform="translate(84 72)">
    <circle cx="28" cy="28" r="23" fill="#FFFFFF" stroke="#D4DCD7" stroke-width="2"/>
    <path d="M17 18 C23 8, 35 8, 41 18" fill="none" stroke="#145D49" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M43 22 C50 33, 44 43, 33 47" fill="none" stroke="#3153A4" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M27 48 C14 47, 8 36, 13 25" fill="none" stroke="#7A4A0A" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="16" cy="19" r="5.5" fill="#7A4A0A"/>
    <circle cx="42" cy="19" r="5.5" fill="#3153A4"/>
    <circle cx="29" cy="47" r="5.5" fill="#145D49"/>
  </g>

  <text x="160" y="94" class="sans green caps">THREE IN THE LOOP</text>
  <text x="160" y="126" class="sans muted" font-size="22" font-weight="700">A WebMCP Research Workbench</text>
  <text x="1390" y="101" class="sans muted" font-size="18" text-anchor="end">research.itprodirect.com</text>

  <g transform="translate(84 196)">
    <text x="0" y="0" class="sans ink" font-size="68" font-weight="800" letter-spacing="-2">Three in the Loop</text>

    <text x="0" y="126" class="sans ink" font-size="90" font-weight="800" letter-spacing="-3.5">
      <tspan x="0" dy="0">The agent gathers.</tspan>
      <tspan x="0" dy="104">You decide what counts.</tspan>
    </text>

    <rect x="0" y="376" width="965" height="4" rx="2" fill="#145D49"/>
    <text x="0" y="440" class="sans muted" font-size="31" font-weight="500">
      <tspan x="0" dy="0">A WebMCP research workbench for human-controlled</tspan>
      <tspan x="0" dy="44">evidence and source-linked synthesis.</tspan>
    </text>
  </g>

  <g opacity="0.95">
    <path d="M1115 218 C1285 220, 1390 340, 1384 500" fill="none" stroke="#D4DCD7" stroke-width="4"/>
    <path d="M1384 500 C1379 659, 1259 748, 1112 748" fill="none" stroke="#D4DCD7" stroke-width="4"/>
    <path d="M1112 748 C1011 635, 1008 347, 1115 218" fill="none" stroke="#D4DCD7" stroke-width="4"/>

    <g filter="url(#shadow)">
      <circle cx="1115" cy="218" r="78" fill="#F9F0DF" stroke="#7A4A0A" stroke-width="3"/>
      <circle cx="1384" cy="500" r="78" fill="#EDF1FB" stroke="#3153A4" stroke-width="3"/>
      <circle cx="1112" cy="748" r="78" fill="#E9F3EF" stroke="#145D49" stroke-width="3"/>
    </g>
    <text x="1115" y="226" class="sans gold" font-size="25" font-weight="800" text-anchor="middle">HUMAN</text>
    <text x="1384" y="508" class="sans agent" font-size="25" font-weight="800" text-anchor="middle">AGENT</text>
    <text x="1112" y="741" class="sans green" font-size="21" font-weight="800" text-anchor="middle">WEBSITE</text>
    <text x="1112" y="769" class="sans muted" font-size="17" font-weight="700" text-anchor="middle">SHARED STATE</text>
  </g>

  <g transform="translate(84 840)">
    <rect x="0" y="0" width="1332" height="90" rx="22" fill="#FFFFFF" stroke="#D4DCD7" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="55" cy="45" r="16" fill="#F9F0DF" stroke="#7A4A0A" stroke-width="2"/>
    <circle cx="93" cy="45" r="16" fill="#EDF1FB" stroke="#3153A4" stroke-width="2"/>
    <circle cx="131" cy="45" r="16" fill="#E9F3EF" stroke="#145D49" stroke-width="2"/>
    <text x="178" y="55" class="sans ink" font-size="30" font-weight="800">Human + Agent + Website working together</text>
    <rect x="1061" y="24" width="225" height="42" rx="21" fill="#E9F3EF"/>
    <text x="1174" y="52" class="sans green" font-size="17" font-weight="800" letter-spacing="1.4" text-anchor="middle">HUMAN-CONTROLLED</text>
  </g>
</svg>
